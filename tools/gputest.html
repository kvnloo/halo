<!doctype html><meta charset=utf-8><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id=c width=640 height=360></canvas>
<script>
const gl = document.getElementById('c').getContext('webgl2', {antialias:false});
const dbg = gl.getExtension('WEBGL_debug_renderer_info');
window.__info = {
  ok: !!gl,
  renderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
  vendor: dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR),
  maxTex: gl.getParameter(gl.MAX_TEXTURE_SIZE),
  maxDraw: gl.getParameter(gl.MAX_DRAW_BUFFERS),
  exts: ['EXT_color_buffer_float','OES_texture_float_linear','EXT_texture_filter_anisotropic','WEBGL_compressed_texture_s3tc','EXT_disjoint_timer_query_webgl2'].filter(e=>!!gl.getExtension(e)),
  aniso: (()=>{const e=gl.getExtension('EXT_texture_filter_anisotropic');return e?gl.getParameter(e.MAX_TEXTURE_MAX_ANISOTROPY_EXT):0})()
};
gl.clearColor(0.1,0.4,0.7,1); gl.clear(gl.COLOR_BUFFER_BIT);
</script>
