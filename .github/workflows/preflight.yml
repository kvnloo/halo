name: preflight

# The repo is public (github.com/kvnloo/halo) but nothing has ever run on a push. This is
# the CPU-only half of the gate — no GPU, no capture, no reference footage (ref/ is
# gitignored licensed material), so it runs anywhere in about a minute.
#
# What it would have caught: KNOWN_ISSUES §20. `ocean.js` and `rocks.js` stopped parsing
# and stayed broken across Waves F and G; both waves' scores were recorded against a scene
# with no ocean in it. A push-triggered `parsecheck` turns that from "discovered by a critic
# two waves later" into a red mark on the commit that introduced it.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # three is needed by tools/_posecheck.mjs (it boots terrain.js headlessly).
      # Puppeteer/Chromium is not — nothing here captures a frame.
      - name: install
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund

      - name: parsecheck — every src/**.js parses, no GLSL-template backticks
        run: node tools/parsecheck.mjs

      - name: posecheck — no camera pose has sunk under the terrain
        run: node tools/_posecheck.mjs

      - name: staged-blob parse gates are themselves runnable
        run: |
          node tools/parsecheck-staged.mjs
          node tools/stagedcheck.mjs

      # `npm run selftest` so CI and a reviewer invoke the exact same string; the flag is
      # in capture.mjs's KNOWN_FLAGS, so this step stays silent when green rather than
      # printing "unknown flag(s) IGNORED" inside the gate's own verification.
      - name: capture integrity gate still fires (no GPU)
        run: npm run selftest

      # `ref/` is absent in CI by design, so `references` is advisory and preflight's
      # soft checks pass. Hard checks (parsecheck, posecheck) are what gate the push.
      - name: preflight
        run: node tools/preflight.mjs

      - name: scores/history.jsonl is parseable and monotonically appended
        run: node tools/historycheck.mjs

      # The trust chain over the written record. Findings here are advisory and never turn
      # the job red; a check that CRASHED does, because `|| true` — what these four steps
      # used to be — makes a tool that died on startup the same colour as a tool that passed.
      # That is the project's signature failure (META_LEDGER round 5: citecheck "had a SECOND
      # way of never measuring anything"; §28's own reproduction prints `0` for a dangling
      # SHA, "indistinguishable from a true negative"). tools/advisory.mjs keeps the exit code:
      #   0/1 = the check produced a result   >=2, a signal, or a stack trace = it did not run
      #
      #   citecheck  — the git objects and paths reports cite still resolve
      #   claimcheck — refuted claims from tools/refuted.json still standing unannotated
      #   provcheck  — adjacent history.jsonl rows share a pose set and an instrument
      #   shotcheck  — a scored shots/<tag> holds frames from exactly one capture
      - name: advisory checks (findings advisory, a crashed check is not)
        run: node tools/advisory.mjs
